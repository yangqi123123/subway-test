<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备信息</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/patrol-table-actions.css" />
  <style>
    .disease-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }
    .disease-layout__right {
      position: sticky;
      top: 72px;
      align-self: start;
      width: 300px;
      max-height: calc(100dvh - 88px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .disease-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .disease-stat-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.22);
      background: linear-gradient(135deg, rgba(8, 15, 35, 0.92), rgba(6, 12, 28, 0.88));
    }
    .disease-stat-card__icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .disease-stat-card--blue .disease-stat-card__icon { background: rgba(59, 130, 246, 0.18); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }
    .disease-stat-card--cyan .disease-stat-card__icon { background: rgba(34, 211, 238, 0.12); color: #67e8f9; border: 1px solid rgba(34, 211, 238, 0.35); }
    .disease-stat-card--amber .disease-stat-card__icon { background: rgba(251, 191, 36, 0.12); color: #fcd34d; border: 1px solid rgba(251, 191, 36, 0.35); }
    .disease-stat-card--green .disease-stat-card__icon { background: rgba(74, 222, 128, 0.12); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.35); }
    .disease-stat-card__value { font-size: 22px; font-weight: 700; color: #f0f9ff; line-height: 1.2; }
    .disease-stat-card__unit { font-size: 12px; font-weight: 400; margin-left: 2px; color: #94a3b8; }
    .disease-stat-card__label { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .disease-stat-card__trend { font-size: 10px; margin-top: 4px; color: #94a3b8; }
    .disease-filter-panel,
    .disease-quick-panel {
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      border: 1px solid rgba(34, 211, 238, 0.2);
      background: rgba(8, 15, 35, 0.78);
    }
    .disease-panel-title {
      font-size: 12px;
      font-weight: 600;
      color: #e2f5ff;
      margin: 0;
      padding: 8px 10px 7px;
      border-bottom: 1px solid rgba(34, 211, 238, 0.12);
      background: rgba(8, 15, 35, 0.92);
    }
    .disease-panel-body { padding: 8px 10px 10px; }
    .disease-filter-panel .disease-panel-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .disease-filter-panel label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 0;
      font-size: 10px;
    }
    .disease-filter-panel label > span:first-child { color: #94a3b8; }
    .disease-filter-panel .wh-input {
      height: 26px !important;
      min-height: 26px;
      font-size: 11px;
      padding: 0 6px;
    }
    .disease-filter-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid rgba(34, 211, 238, 0.1);
    }
    .disease-filter-actions button {
      flex: 1;
      padding-top: 4px;
      padding-bottom: 4px;
      font-size: 11px;
    }
    .disease-list-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .disease-quick-panel .disease-panel-body { padding: 6px 10px 8px; }
    .disease-quick-link {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 5px;
      border-radius: 6px;
      border: 1px solid rgba(34, 211, 238, 0.14);
      background: rgba(15, 23, 42, 0.45);
      color: #e2f5ff;
      font-size: 11px;
      text-decoration: none;
    }
    .disease-quick-link:last-child { margin-bottom: 0; }
    .disease-quick-link:hover {
      border-color: rgba(34, 211, 238, 0.4);
      background: rgba(34, 211, 238, 0.08);
      color: #fff;
    }
    .disease-quick-link.is-active {
      border-color: rgba(34, 211, 238, 0.55);
      background: rgba(34, 211, 238, 0.12);
      color: #a5f3fc;
    }
    .disease-quick-link i {
      width: 16px;
      text-align: center;
      color: #67e8f9;
      font-size: 12px;
    }
    @media (max-width: 1400px) {
      .disease-layout { grid-template-columns: 1fr; }
      .disease-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .disease-layout__right {
        position: static;
        width: 100%;
        max-height: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }
    @media (max-width: 768px) {
      .disease-stats { grid-template-columns: 1fr; }
      .disease-layout__right { grid-template-columns: 1fr; }
    }
    .device-table th,
    .device-table td {
      height: 52px;
      border-right: 1px solid rgba(34,211,238,.08);
      border-bottom: 1px solid rgba(34,211,238,.08);
      vertical-align: middle;
    }
    .device-table th:last-child,
    .device-table td:last-child { border-right: 0; }
    .device-table thead th {
      color: rgba(240,249,255,.96);
      font-size: 12px;
      font-weight: 600;
      background: rgba(2,8,23,.66);
      white-space: nowrap;
    }
    .device-table tbody td {
      color: rgba(226,245,255,.88);
      font-size: 12px;
    }
    .device-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 10px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
    }
    .device-modal-mask,
    .device-import-mask,
    .confirm-mask {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15,23,42,.56);
      padding: 24px;
    }
    .device-modal-mask.show,
    .device-import-mask.show,
    .confirm-mask.show { display: flex; }
    .device-modal {
      width: min(920px, 92vw);
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,.16);
      background: #071426;
      box-shadow: 0 24px 80px rgba(0,0,0,.48);
      overflow: hidden;
    }
    .device-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 28px;
    }
    .device-form-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .device-form-item--full { grid-column: 1 / -1; }
    .device-form-item--top { align-items: flex-start; }
    .device-form-item--top .device-form-label { line-height: 32px; }
    .device-form-label {
      width: 96px;
      flex: 0 0 96px;
      text-align: right;
      color: rgba(226,245,255,.78);
      font-size: 12px;
    }
    .device-form-label.is-required::before {
      content: "*";
      color: #fb7185;
      margin-right: 4px;
    }
    .device-upload {
      flex: 1;
      min-width: 0;
      border: 1px dashed rgba(34, 211, 238, 0.3);
      border-radius: 8px;
      background: rgba(8, 15, 35, 0.45);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: rgba(156, 198, 223, 0.85);
      font-size: 12px;
      text-align: center;
    }
    .device-upload:hover { border-color: rgba(34, 211, 238, 0.55); }
    .device-upload.is-dragover {
      border-color: rgba(34, 211, 238, 0.75);
      background: rgba(34, 211, 238, 0.08);
    }
    .device-upload__hint { font-size: 10px; color: #64748b; }
    .device-upload__preview img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(34, 211, 238, 0.25);
    }
    .device-upload__preview {
      position: relative;
      display: none;
    }
    .device-upload__preview.show { display: block; }
    .device-upload__remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: #f43f5e;
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      cursor: pointer;
    }
    .device-import {
      width: min(560px, 92vw);
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,.16);
      background: #071426;
      box-shadow: 0 24px 80px rgba(0,0,0,.48);
      overflow: hidden;
    }
    .device-import__drop {
      margin: 20px 24px 0;
      border: 1px dashed rgba(34, 211, 238, 0.3);
      border-radius: 8px;
      background: rgba(8, 15, 35, 0.45);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: rgba(156, 198, 223, 0.85);
      font-size: 12px;
    }
    .device-import__drop:hover { border-color: rgba(34, 211, 238, 0.55); }
    .device-import__drop.is-dragover {
      border-color: rgba(34, 211, 238, 0.75);
      background: rgba(34, 211, 238, 0.08);
    }
    .device-import__drop i { font-size: 26px; color: #67e8f9; }
    .device-import__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 24px 0;
      font-size: 11px;
      color: #64748b;
    }
    .device-import__meta a {
      color: #67e8f9;
      text-decoration: none;
    }
    .device-import__meta a:hover { color: #a5f3fc; }
    .device-import__file {
      padding: 8px 24px 0;
      font-size: 11px;
      color: #86efac;
      min-height: 22px;
    }
    .confirm-card {
      width: 320px;
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,.14);
      background: #071426;
      box-shadow: 0 24px 80px rgba(0,0,0,.48);
      overflow: hidden;
    }
    .am-detail-mask {
      position: fixed;
      inset: 0;
      z-index: 115;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(2, 8, 23, 0.72);
    }
    .am-detail-mask.show { display: flex; }
    .am-detail-dialog {
      width: min(1180px, 96vw);
      max-height: min(86vh, 900px);
      border-radius: 8px;
      border: 1px solid rgba(34, 211, 238, 0.18);
      background: linear-gradient(180deg, #071525, #020617);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .am-detail-dialog__head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(34, 211, 238, 0.12);
    }
    .am-detail-dialog__body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 20px 24px 16px;
    }
    .am-detail-dialog__foot {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 24px 18px;
      border-top: 1px solid rgba(34, 211, 238, 0.1);
    }
    .detail-value {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      line-height: 32px;
      color: rgba(226, 245, 255, 0.92);
      font-size: 12px;
      word-break: break-word;
    }
    .detail-value--empty { color: #64748b; }
    .usage-table-wrap {
      overflow-x: auto;
      border: 1px solid rgba(34, 211, 238, 0.18);
      border-radius: 8px;
      background: rgba(8, 15, 35, 0.45);
    }
    .usage-table {
      width: 100%;
      min-width: 1500px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .usage-table th {
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: #9cc6df;
      background: rgba(34, 211, 238, 0.08);
      border-bottom: 1px solid rgba(34, 211, 238, 0.18);
      white-space: nowrap;
    }
    .usage-table td {
      padding: 8px 12px;
      color: rgba(226, 245, 255, 0.88);
      border-bottom: 1px solid rgba(34, 211, 238, 0.1);
      white-space: nowrap;
    }
    .usage-table tbody tr:last-child td { border-bottom: none; }
    .usage-empty {
      padding: 28px 12px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
    .usage-filter {
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 10px;
    }
    .usage-filter label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin: 0;
      font-size: 10px;
      color: #94a3b8;
      flex: 1;
      min-width: 0;
    }
    .usage-filter .wh-input {
      height: 26px !important;
      min-height: 26px;
      font-size: 11px;
      padding: 0 6px;
      width: 100%;
      min-width: 0;
    }
    .usage-filter button {
      height: 26px;
      padding: 0 14px;
      font-size: 11px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .detail-photo img {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(34, 211, 238, 0.25);
    }
  </style>
</head>
<body data-shell="default" data-top="wb" data-sidebar-key="in-track-device" data-wb-view="page">
  <div id="page-root" class="max-w-[1920px] mx-auto min-h-full">
    <div class="mb-4 flex flex-wrap items-center justify-between gap-3 border-b border-cyan-400/10 pb-3">
      <h1 class="text-base md:text-lg font-semibold text-white tracking-tight" style="text-shadow:0 0 20px rgba(34,211,238,0.25)">设备信息</h1>
      <span class="text-[10px] px-2 py-1 rounded-md border border-cyan-400/25 text-cyan-100/80 bg-cyan-500/5">设备信息面板</span>
    </div>

    <section id="device-list-view">
      <div class="disease-layout">
        <div class="disease-layout__left">
          <div class="disease-stats" aria-label="设备统计">
            <div class="disease-stat-card disease-stat-card--blue">
              <div class="disease-stat-card__icon"><i class="fa-solid fa-microchip"></i></div>
              <div>
                <div id="stat-total" class="disease-stat-card__value"><span class="disease-stat-card__num">0</span><span class="disease-stat-card__unit">台</span></div>
                <div class="disease-stat-card__label">设备总数</div>
                <div class="disease-stat-card__trend">定位设备台账</div>
              </div>
            </div>
            <div class="disease-stat-card disease-stat-card--green">
              <div class="disease-stat-card__icon"><i class="fa-solid fa-signal"></i></div>
              <div>
                <div id="stat-online" class="disease-stat-card__value"><span class="disease-stat-card__num">0</span><span class="disease-stat-card__unit">台</span></div>
                <div class="disease-stat-card__label">在线设备</div>
                <div class="disease-stat-card__trend">今日有在线记录</div>
              </div>
            </div>
            <div class="disease-stat-card disease-stat-card--amber">
              <div class="disease-stat-card__icon"><i class="fa-solid fa-plug-circle-xmark"></i></div>
              <div>
                <div id="stat-offline" class="disease-stat-card__value"><span class="disease-stat-card__num">0</span><span class="disease-stat-card__unit">台</span></div>
                <div class="disease-stat-card__label">离线设备</div>
                <div class="disease-stat-card__trend">最近无在线记录</div>
              </div>
            </div>
            <div class="disease-stat-card disease-stat-card--cyan">
              <div class="disease-stat-card__icon"><i class="fa-solid fa-link"></i></div>
              <div>
                <div id="stat-bound" class="disease-stat-card__value"><span class="disease-stat-card__num">0</span><span class="disease-stat-card__unit">台</span></div>
                <div class="disease-stat-card__label">已绑定人员</div>
                <div class="disease-stat-card__trend">绑定中的设备</div>
              </div>
            </div>
          </div>

          <div class="disease-list-area">
            <div class="disease-list-toolbar">
              <button type="button" class="px-4 py-1.5 rounded text-xs wh-btn-primary" data-action="new-device">
                <i class="fa-solid fa-plus mr-1"></i>新增
              </button>
              <button id="btn-import" type="button" class="px-4 py-1.5 rounded text-xs wh-btn-ghost">
                <i class="fa-solid fa-file-import mr-1"></i>导入设备
              </button>
              <button id="btn-export" type="button" class="px-4 py-1.5 rounded text-xs wh-btn-ghost">
                <i class="fa-solid fa-file-export mr-1"></i>导出
              </button>
            </div>
            <div class="wh-table-shell bg-slate-950/35">
              <div class="am-table-wrap overflow-x-auto">
                <table class="device-table min-w-[2000px] w-full text-left">
                  <thead>
                    <tr>
                      <th class="px-4">设备IMEI</th>
                      <th class="px-4">设备型号</th>
                      <th class="px-4">设备名称</th>
                      <th class="px-4">颜色</th>
                      <th class="px-4">产地</th>
                      <th class="px-4">厂家</th>
                      <th class="px-4">最后在线时间</th>
                      <th class="px-4">备注</th>
                      <th class="px-4">创建时间</th>
                      <th class="px-4 disease-col-actions">操作</th>
                    </tr>
                  </thead>
                  <tbody id="device-table-body"></tbody>
                </table>
              </div>
              <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-cyan-400/15 bg-slate-950/55 text-[11px] text-slate-400">
                <span>共 <b id="table-total" class="text-cyan-200">0</b> 条</span>
                <div class="flex items-center gap-2 flex-wrap">
                  <button type="button" class="min-w-[32px] h-8 rounded text-xs wh-btn-primary">1</button>
                  <select class="wh-input px-2 py-1 text-[11px]"><option>10 条/页</option></select>
                  <span>跳至</span>
                  <input class="wh-input w-12 px-1 py-1 text-center text-[11px]" value="1" />
                  <span>页</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <aside class="disease-layout__right" aria-label="筛选与快捷操作">
          <div class="disease-filter-panel">
            <div class="disease-panel-title"><i class="fa-solid fa-filter mr-2 text-cyan-400"></i>快捷筛选</div>
            <div class="disease-panel-body">
              <label>
                <span>设备IMEI</span>
                <input id="filter-imei" class="wh-input w-full" placeholder="请输入设备IMEI" />
              </label>
              <label>
                <span>设备型号</span>
                <input id="filter-model" class="wh-input w-full" placeholder="请输入设备型号" />
              </label>
              <label>
                <span>在线开始时间</span>
                <input id="filter-online-start" type="date" class="wh-input w-full" />
              </label>
              <label>
                <span>在线结束时间</span>
                <input id="filter-online-end" type="date" class="wh-input w-full" />
              </label>
              <div class="disease-filter-actions">
                <button id="btn-search" type="button" class="wh-btn-primary">搜索</button>
                <button id="btn-reset" type="button" class="wh-btn-ghost">重置</button>
              </div>
            </div>
          </div>

          <div data-quick-links-group="巡查质量"></div>
        </aside>
      </div>
    </section>
  </div>

  <div id="device-detail-mask" class="am-detail-mask" aria-hidden="true">
    <div class="am-detail-dialog" role="dialog" aria-labelledby="device-detail-title">
      <div class="am-detail-dialog__head">
        <div>
          <h3 id="device-detail-title" class="text-white font-semibold text-sm m-0">设备详情</h3>
          <div id="device-detail-subtitle" class="text-[11px] text-slate-400 mt-0.5">定位设备</div>
        </div>
        <button type="button" class="wh-modal-close text-slate-400 hover:text-white text-xl leading-none" data-action="close-device-detail" aria-label="关闭">×</button>
      </div>
      <div id="device-detail-body" class="am-detail-dialog__body"></div>
      <div class="am-detail-dialog__foot">
        <button type="button" class="px-6 h-8 rounded text-xs wh-btn-ghost" data-action="close-device-detail">关闭</button>
      </div>
    </div>
  </div>

  <div id="device-modal-mask" class="device-modal-mask">
    <div class="device-modal">
      <div class="h-14 px-6 flex items-center justify-between gap-3 border-b border-cyan-400/15">
        <h3 id="device-modal-title" class="text-white text-[16px] font-semibold">新增设备</h3>
        <button type="button" class="wh-modal-close" aria-label="关闭" data-action="close-device-modal">×</button>
      </div>
      <div class="p-6">

      function xmlEscape(value) {
        return String(value === undefined || value === null ? "" : value)

      function downloadXls(filename, sheetName, headers, dataRows) {
        var xml =
          '<?xml version="1.0" encoding="UTF-8"?>\n' +
          '<?mso-application progid="Excel.Sheet"?>\n' +
          '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
          'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
          '<Worksheet ss:Name="' + xmlEscape(sheetName) + '"><Table>';
        xml += "<Row>" + headers.map(function (h) {
          return '<Cell><Data ss:Type="String">' + xmlEscape(h) + "</Data></Cell>";
        }).join("") + "</Row>";
        (dataRows || []).forEach(function (row) {
          xml += "<Row>" + row.map(function (cell) {
            return '<Cell><Data ss:Type="String">' + xmlEscape(cell) + "</Data></Cell>";
          }).join("") + "</Row>";
        });
        xml += "</Table></Worksheet></Workbook>";
        var blob = new Blob(["\ufeff" + xml], { type: "application/vnd.ms-excel" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
      }

        var headers = ["设备IMEI", "设备型号", "设备名称", "颜色", "产地", "厂家", "最后在线时间", "备注", "创建时间"];
        var dataRows = displayRows.map(function (row) {
          return [row.imei, row.model, row.name, row.color, row.origin, row.maker, row.lastOnline, row.remark || "", row.createdAt];
        });
        downloadXls("设备信息导出.xls", "设备信息", headers, dataRows);
      }

      function downloadImportTemplate() {
        var headers = ["设备IMEI（必填）", "设备型号（必填）", "设备名称", "颜色", "产地", "厂家", "备注"];
        downloadXls("设备导入模板.xls", "设备导入模板", headers, []);
      }

      document.getElementById("btn-search").addEventListener("click", applyFilter);
      document.getElementById("btn-reset").addEventListener("click", resetFilters);
      document.getElementById("btn-export").addEventListener("click", exportDevices);
      document.getElementById("btn-import").addEventListener("click", openImport);
      document.getElementById("device-import-template").addEventListener("click", function (event) {
        event.preventDefault();
        downloadImportTemplate();
      });

      importInput.addEventListener("change", function () {
        showImportFile(importInput.files && importInput.files[0]);
      });
      importDrop.addEventListener("dragover", function (e) {
        e.preventDefault();
        importDrop.classList.add("is-dragover");
      });
      importDrop.addEventListener("dragleave", function () {
        importDrop.classList.remove("is-dragover");
      });
      importDrop.addEventListener("drop", function (e) {
        e.preventDefault();
        importDrop.classList.remove("is-dragover");
        var file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (!file) return;
        if (!/\.(xlsx|xls)$/i.test(file.name)) {
          alert("仅支持上传 .xlsx、.xls 格式文件");
          return;
        }
        try {
          var dt = new DataTransfer();
          dt.items.add(file);
          importInput.files = dt.files;
        } catch (err) {
          /* 部分环境不支持 DataTransfer 赋值 */
        }
        showImportFile(file);
      });

      photoInput.addEventListener("change", function () {
        pickPhoto(photoInput.files && photoInput.files[0]);
      });
      photoDrop.addEventListener("dragover", function (e) {
        e.preventDefault();
        photoDrop.classList.add("is-dragover");
      });
      photoDrop.addEventListener("dragleave", function () {
        photoDrop.classList.remove("is-dragover");
      });
      photoDrop.addEventListener("drop", function (e) {
        e.preventDefault();
        photoDrop.classList.remove("is-dragover");
        pickPhoto(e.dataTransfer.files && e.dataTransfer.files[0]);
      });
      document.getElementById("device-photo-remove").addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (photoUrl && photoUrl.indexOf("blob:") === 0) URL.revokeObjectURL(photoUrl);
        photoUrl = "";
        photoInput.value = "";
        renderPhotoPreview();
      });

      function setupListRowClick() {
        if (!window.WHTableRowClick) return window.setTimeout(setupListRowClick, 40);
        WHTableRowClick.bindById("device-table-body", {
          getRows: function () { return displayRows; },
          onOpen: function (row, index) { openDetail(index); }
        });
      }
      setupListRowClick();
      displayRows = rows.slice();
      renderRows();

      document.addEventListener("click", function (event) {
        var trigger = event.target.closest("[data-action]");
        if (!trigger) return;
        var action = trigger.getAttribute("data-action");
        var imei = trigger.getAttribute("data-device-imei");
        var index = imei ? findRowIndex(imei) : -1;
        if (action === "new-device") openModal("new");
        if (action === "edit-device" && index > -1) openModal("edit", index);
        if (action === "detail-device" && index > -1) {
          var displayIndex = displayRows.indexOf(rows[index]);
          openDetail(displayIndex > -1 ? displayIndex : index);
        }
        if (action === "usage-device" && index > -1) {
          var usageDisplayIndex = displayRows.indexOf(rows[index]);
          openDetail(usageDisplayIndex > -1 ? usageDisplayIndex : index, "usage");
        }
        if (action === "delete-device" && imei) {
          deleteImei = imei;
          confirmMask.classList.add("show");
        }
        if (action === "close-device-modal") closeModal();
        if (action === "close-device-detail") closeDetail();
        if (action === "usage-search") {
          usageFilter = {
            imei: document.getElementById("usage-f-imei").value.trim(),
            model: document.getElementById("usage-f-model").value.trim(),
            user: document.getElementById("usage-f-user").value.trim(),
            useStart: document.getElementById("usage-f-start").value,
            useEnd: document.getElementById("usage-f-end").value,
          };
          renderDetailBody();
        }
        if (action === "usage-reset") {
          resetUsageFilter();
          renderDetailBody();
        }
        if (action === "close-device-import") closeImport();
        if (action === "save-device") saveDevice();
        if (action === "confirm-device-import") {
          closeImport();
          alert("设备数据导入完成");
        }
        if (action === "cancel-delete") {
          deleteImei = "";
          confirmMask.classList.remove("show");
        }
        if (action === "confirm-delete") {
          var deleteIndex = deleteImei ? findRowIndex(deleteImei) : -1;
          if (deleteIndex > -1) rows.splice(deleteIndex, 1);
          deleteImei = "";
          confirmMask.classList.remove("show");
          applyFilter();
        }
      });
      if (detailMask) {
        detailMask.addEventListener("click", function (event) {
          if (event.target === detailMask) closeDetail();
        });
      }
    })();
  </script>
  <script src="../../assets/js/menu-config.js"></script>
  <script src="../../assets/js/quick-links-panel.js"></script>
  <script src="../../assets/js/workbench-mega.js"></script>
  <script src="../../assets/js/shell.js"></script>
</body>
</html>
