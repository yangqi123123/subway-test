<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UAV Review Tabbar Test Shell</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    .device-tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .device-tabbar.is-hidden { display: none !important; }
    #test-frame {
      width: 100%;
      height: calc(100% - 60px);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="device-tabbar" id="test-tabbar">底部 Tabbar</div>
  <iframe id="test-frame" src="/app/patrol/pages/patrol-alerts.html?hideHeader=1"></iframe>
  <script>
    window.addEventListener('message', function (event) {
      var data = event.data;
      if (!data || data.type !== 'wh-miniapp-tabbar') return;
      var bar = document.getElementById('test-tabbar');
      if (bar) bar.classList.toggle('is-hidden', !!data.hidden);
    });
  </script>
</body>
</html>
