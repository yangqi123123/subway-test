<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>知识库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/miniapp.css" />
  <link rel="stylesheet" href="../../assets/css/in-project-mobile.css" />
  <link rel="stylesheet" href="../../assets/css/score-mobile.css" />
  <style>
    body.mp-library-page { background: var(--mp-bg-subtle); }
    .mp-library-app { position: absolute; inset: var(--miniapp-navbar-h, 52px) 0 0; overflow: hidden; }
    .mp-library-scroll { height: 100%; overflow-y: auto; padding: 12px 14px 24px; }
    .mp-library-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .mp-library-toolbar .mp-search-input-wrap { flex:1; }
    .mp-library-list { display:flex; flex-direction:column; gap:12px; }
    .mp-library-project { border-radius:14px; border:1px solid var(--mp-border-subtle); background:#fff; box-shadow:0 8px 24px rgba(15,23,42,.06); overflow:hidden; }
    .mp-library-project__head { padding:12px 14px; border-bottom:1px solid rgba(148,163,184,.16); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .mp-library-project__name { margin:0; color:#0f172a; font-size:15px; font-weight:700; line-height:1.35; }
    .mp-library-project__count { flex-shrink:0; border-radius:999px; background:rgba(37,99,235,.08); color:#1d4ed8; padding:3px 8px; font-size:11px; font-weight:600; }
    .mp-library-card { padding:12px 14px 14px; border-top:1px solid rgba(148,163,184,.10); }
    .mp-library-card:first-of-type { border-top:0; }
    .mp-library-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:10px; }
    .mp-library-meta div { min-width:0; }
    .mp-library-meta dt { color:#64748b; font-size:11px; line-height:1.4; }
    .mp-library-meta dd { margin:2px 0 0; color:#0f172a; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mp-library-spectrum { display:flex; gap:10px; align-items:center; padding:9px; border-radius:12px; background:linear-gradient(135deg,#eff6ff,#f8fafc); border:1px solid rgba(37,99,235,.10); }
    .mp-library-spectrum img { width:96px; height:48px; object-fit:contain; border-radius:8px; background:#020617; border:1px solid rgba(15,23,42,.12); }
    .mp-library-spectrum__text { min-width:0; flex:1; }
    .mp-library-spectrum__title { color:#0f172a; font-size:13px; font-weight:700; margin:0 0 3px; }
    .mp-library-spectrum__desc { color:#64748b; font-size:11px; margin:0; line-height:1.5; }
    .mp-library-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
    .mp-library-action { height:30px; padding:0 12px; border-radius:999px; border:1px solid rgba(37,99,235,.18); background:#fff; color:#2563eb; font-size:12px; font-weight:600; }
    .mp-library-empty { padding:34px 18px; text-align:center; color:#94a3b8; font-size:13px; }
    .mp-library-filter-sheet { position:fixed; inset:0; z-index:120; display:none; align-items:flex-end; background:rgba(15,23,42,.45); }
    .mp-library-filter-sheet.show { display:flex; }
    .mp-library-filter-sheet__mask { position:absolute; inset:0; }
    .mp-library-filter-sheet__panel { position:relative; width:100%; border-radius:18px 18px 0 0; background:#fff; box-shadow:0 -20px 48px rgba(15,23,42,.18); overflow:hidden; }
    .mp-library-filter-sheet__head { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(226,232,240,.8); }
    .mp-library-filter-sheet__head h2 { margin:0; font-size:15px; color:#0f172a; font-weight:700; }
    .mp-library-filter-sheet__body { padding:14px 16px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
    .mp-library-filter-field { display:flex; flex-direction:column; gap:4px; }
    .mp-library-filter-field--full { grid-column:1 / -1; }
    .mp-library-filter-field span { font-size:11px; color:#64748b; }
    .mp-library-filter-field .wh-input { height:34px; min-height:34px; font-size:12px; }
    .mp-library-filter-sheet__foot { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; border-top:1px solid rgba(226,232,240,.8); }
    .mp-library-filter-sheet__foot button { flex:1; }
    .mp-library-filter-btn { height:36px; padding:0 14px; border-radius:12px; border:1px solid rgba(37,99,235,.18); background:#fff; color:#2563eb; font-size:12px; font-weight:600; white-space:nowrap; }
    .mp-library-filter-btn--primary { color:#fff; background:#2563eb; border-color:#2563eb; }
    .mp-library-filter-chip { display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border-radius:999px; border:1px solid rgba(37,99,235,.18); background:#fff; color:#2563eb; font-size:12px; font-weight:600; white-space:nowrap; }
    .mp-library-filter-chip i { font-size:11px; }
  </style>
</head>
<body class="mp-library-page mp-score-page mp-project-page miniapp-page" data-miniapp="page" data-module="patrol" data-title="知识库" data-base="../">
  <header class="miniapp-navbar miniapp-navbar--inner">
    <button type="button" class="miniapp-navbar__back" data-action="mp-nav-back" aria-label="返回"><i class="fa-solid fa-chevron-left"></i></button>
    <h1 class="miniapp-navbar__title">知识库</h1>
  </header>

  <main class="mp-library-app">
    <div class="mp-library-scroll">
      <div class="mp-library-toolbar">
        <div class="mp-search-input-wrap">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="text" id="library-search" class="mp-search-input" placeholder="搜索项目" />
        </div>
        <button type="button" class="mp-library-filter-chip" id="library-filter-toggle"><i class="fa-solid fa-filter"></i>筛选</button>
      </div>
      <div id="library-list" class="mp-library-list"></div>
    </div>
  </main>

  <div id="library-filter-sheet" class="mp-library-filter-sheet" aria-hidden="true">
    <div class="mp-library-filter-sheet__mask" data-action="close-library-filter"></div>
    <div class="mp-library-filter-sheet__panel" role="dialog" aria-label="筛选条件">
      <div class="mp-library-filter-sheet__head">
        <h2>快捷筛选</h2>
        <button type="button" class="mp-icon-btn" data-action="close-library-filter" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="mp-library-filter-sheet__body">
        <label class="mp-library-filter-field"><span>报警区间</span><input id="library-filter-section" class="wh-input w-full px-2" placeholder="请输入报警区间" /></label>
        <label class="mp-library-filter-field"><span>报警位置</span><input id="library-filter-position" class="wh-input w-full px-2" placeholder="请输入报警位置" /></label>
        <label class="mp-library-filter-field"><span>开始时间</span><input id="library-filter-start" type="datetime-local" class="wh-input w-full px-2" /></label>
        <label class="mp-library-filter-field"><span>结束时间</span><input id="library-filter-end" type="datetime-local" class="wh-input w-full px-2" /></label>
      </div>
      <div class="mp-library-filter-sheet__foot">
        <button type="button" class="mp-library-filter-btn" id="library-filter-reset">重置</button>
        <button type="button" class="mp-library-filter-btn mp-library-filter-btn--primary" id="library-filter-apply">筛选</button>
      </div>
    </div>
  </div>
  

  <script src="../../assets/js/miniapp-frame.js"></script>
  <script>
    (function(){
      var spectrumSrc = "../../../assets/images/annotate-spectrum.png";
      var rows = [
        {project:"金融街六中北项目",section:"中南医院站-湖北日报站",position:"Z25+610",type:"施工扰动",time:"2026-03-05 18:30:46"},
        {project:"金融街六中北项目",section:"中南医院站-湖北日报站",position:"Z25+645",type:"光纤扰动",time:"2026-03-05 19:12:20"},
        {project:"武昌滨江地下空间",section:"徐家棚站-三角路站",position:"Y12+180",type:"结构异常",time:"2026-03-06 09:22:13"},
        {project:"汉口商务区综合体",section:"王家墩东站-范湖站",position:"Z08+330",type:"施工扰动",time:"2026-03-07 11:08:55"}
      ];
      var listEl = document.getElementById("library-list");
      var searchEl = document.getElementById("library-search");
      var filterSheet = document.getElementById("library-filter-sheet");
      var filterToggle = document.getElementById("library-filter-toggle");
      var filterSection = document.getElementById("library-filter-section");
      var filterPosition = document.getElementById("library-filter-position");
      var filterStart = document.getElementById("library-filter-start");
      var filterEnd = document.getElementById("library-filter-end");
      var currentFilter = { section: "", position: "", start: "", end: "" };
      function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
      function group(list){
        var map = {};
        list.forEach(function(row){ if(!map[row.project]) map[row.project]=[]; map[row.project].push(row); });
        return Object.keys(map).map(function(name){return {name:name,items:map[name]};});
      }
      function card(row){
        return '<article class="mp-library-card">'+
          '<dl class="mp-library-meta">'+
            '<div><dt>报警区间</dt><dd>'+esc(row.section)+'</dd></div>'+
            '<div><dt>报警位置</dt><dd>'+esc(row.position)+'</dd></div>'+
            '<div><dt>报警类型</dt><dd>'+esc(row.type)+'</dd></div>'+
            '<div><dt>报警时间</dt><dd>'+esc(row.time)+'</dd></div>'+
          '</dl>'+
          '<div class="mp-library-spectrum"><img src="'+spectrumSrc+'" alt="频谱图" /><div class="mp-library-spectrum__text"><p class="mp-library-spectrum__title">频谱图样本</p><p class="mp-library-spectrum__desc">同一项目频谱图已归并展示，便于移动端快速查阅。</p></div></div>'+
          '<div class="mp-library-actions"><button class="mp-library-action" type="button">预览</button></div></article>';
      }
      function inRange(time, start, end){
        if (start && time < start) return false;
        if (end && time > end) return false;
        return true;
      }
      function render(){
        var q = (searchEl.value||"").trim();
        var data = rows.filter(function(row){
          if (q && row.project.indexOf(q) === -1) return false;
          if (currentFilter.section && row.section.indexOf(currentFilter.section) === -1) return false;
          if (currentFilter.position && row.position.indexOf(currentFilter.position) === -1) return false;
          if (!inRange(row.time, currentFilter.start, currentFilter.end)) return false;
          return true;
        });
        var groups = group(data);
        listEl.innerHTML = groups.length ? groups.map(function(g){
          return '<section class="mp-library-project"><div class="mp-library-project__head"><h2 class="mp-library-project__name">'+esc(g.name)+'</h2><span class="mp-library-project__count">'+g.items.length+' 张</span></div>'+g.items.map(card).join('')+'</section>';
        }).join('') : '<div class="mp-library-empty"><i class="fa-regular fa-folder-open text-2xl mb-2"></i><br/>暂无匹配频谱图</div>';
      }
      function openFilter(){
        filterSheet.classList.add("show");
        filterSheet.setAttribute("aria-hidden","false");
        filterSection.value = currentFilter.section;
        filterPosition.value = currentFilter.position;
        filterStart.value = currentFilter.start;
        filterEnd.value = currentFilter.end;
      }
      function closeFilter(){
        filterSheet.classList.remove("show");
        filterSheet.setAttribute("aria-hidden","true");
      }
      function applyFilter(){
        currentFilter.section = filterSection.value.trim();
        currentFilter.position = filterPosition.value.trim();
        currentFilter.start = filterStart.value.trim();
        currentFilter.end = filterEnd.value.trim();
        closeFilter();
        render();
      }
      function resetFilter(){
        currentFilter = { section: "", position: "", start: "", end: "" };
        filterSection.value = "";
        filterPosition.value = "";
        filterStart.value = "";
        filterEnd.value = "";
        render();
      }
      searchEl.addEventListener("input", render);
      filterToggle.addEventListener("click", openFilter);
      document.getElementById("library-filter-reset").addEventListener("click", resetFilter);
      document.getElementById("library-filter-apply").addEventListener("click", applyFilter);
      document.querySelectorAll("[data-action='close-library-filter']").forEach(function(btn){ btn.addEventListener("click", closeFilter); });
      render();
      function goBackToPatrol() {
        window.location.href = "../../patrol/home.html";
      }

      if (window.MiniAppFrame && MiniAppFrame.bindBack) {
        MiniAppFrame.bindBack(goBackToPatrol);
      }
      var backBtn = document.querySelector(".miniapp-navbar__back");
      if (backBtn) backBtn.addEventListener("click", function (e) {
        e.preventDefault();
        goBackToPatrol();
      });
    })();
  </script>
</body>
</html>
