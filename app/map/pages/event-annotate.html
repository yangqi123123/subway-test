<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>典型事件标注</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/miniapp.css" />
  <link rel="stylesheet" href="../../assets/css/in-project-mobile.css" />
  <link rel="stylesheet" href="../../assets/css/disease-mobile.css" />
  <link rel="stylesheet" href="../../assets/css/drone-stats-mobile.css" />
  <link rel="stylesheet" href="../../assets/css/event-annotate-mobile.css" />
</head>
<body class="mp-disease-page mp-drone-stats-page mp-project-page mp-event-annotate-page miniapp-page" data-miniapp="page" data-module="patrol" data-title="典型事件标注" data-base="../">
  <header class="miniapp-navbar miniapp-navbar--inner">
    <button type="button" class="miniapp-navbar__back" data-action="mp-nav-back" aria-label="返回">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <h1 class="miniapp-navbar__title">典型事件标注</h1>
  </header>

  <div id="event-annotate-app" class="mp-disease-app mp-project-app">
    <section id="event-annotate-view" class="mp-project-view">
      <div class="mp-list-scroll">
        <div class="mp-drone-chart-stack mp-event-annotate-stack">

          <!-- 典型事件对比 -->
          <section class="mp-drone-chart-card mp-event-compare-card">
            <div class="mp-drone-chart-card__head mp-event-compare-head">
              <div class="mp-event-compare-title-row">
                <div class="mp-drone-chart-card__title">典型事件对比</div>
                <button type="button" class="mp-event-collapse-btn" id="event-compare-collapse-btn" aria-expanded="true">
                  收起 <i class="fa-solid fa-chevron-up"></i>
                </button>
              </div>
            </div>
            <div id="event-compare-body" class="mp-event-compare-body">
              <div id="event-compare-point" class="mp-event-compare-point"></div>
              <div id="event-compare-meta" class="mp-event-compare-meta"></div>
              <button type="button" id="event-open-generate-btn" class="mp-event-open-generate-btn">去生成对比频谱图</button>
              <div class="mp-event-dual-spectrum">
                <article class="mp-event-dual-spectrum__item">
                  <div class="mp-event-dual-spectrum__title">当前告警点频谱图</div>
                  <div class="mp-event-spectrum-wrap mp-event-spectrum-wrap--dark mp-event-dual-spectrum__canvas" data-action="spectrum-preview" data-index="0">
                    <img id="event-current-spectrum" class="mp-event-spectrum-img mp-event-spectrum-img--dual" src="../../../assets/images/annotate-spectrum.png" alt="当前告警点频谱图" />
                  </div>
                </article>
                <article class="mp-event-dual-spectrum__item">
                  <div id="event-compare-title" class="mp-event-dual-spectrum__title">对比频谱图</div>
                  <div id="event-compare-wrap" class="mp-event-spectrum-wrap mp-event-compare-wrap mp-event-dual-spectrum__canvas" data-action="spectrum-preview" data-index="1">
                    <div id="event-compare-empty" class="mp-event-compare-empty">点击「去生成对比频谱图」加载右侧频谱图</div>
                    <div class="mp-event-compare-empty-hint">点击放大预览</div>
                    <img id="event-compare-spectrum" class="mp-event-spectrum-img mp-event-spectrum-img--dual" alt="对比频谱图" />
                  </div>
                </article>
              </div>
              <div id="event-compare-detail" class="mp-event-compare-detail"></div>
            </div>
          </section>

          <!-- 事件归类 -->
          <section class="mp-drone-chart-card mp-event-form-card">
            <div class="mp-drone-chart-card__head">
              <div class="mp-drone-chart-card__title">该事件归类为</div>
            </div>
            <div class="mp-event-form-grid">
              <label class="mp-event-form-field">
                <span>归类于</span>
                <select id="event-classify" class="mp-event-input"></select>
              </label>
              <label class="mp-event-form-field">
                <span>加入典型事件</span>
                <select id="event-add-typical" class="mp-event-input">
                  <option value="yes">是</option>
                  <option value="no">否</option>
                </select>
              </label>
              <label class="mp-event-form-field mp-event-form-field--full">
                <span>备注</span>
                <textarea id="event-remark" class="mp-event-textarea" placeholder="请输入" maxlength="240"></textarea>
                <div class="mp-event-textarea-count"><span id="event-remark-count">0</span>/240</div>
              </label>
            </div>
          </section>

          <!-- <button type="button" id="event-toggle-legacy-btn" class="mp-event-open-generate-btn" style="margin-top:0;background:linear-gradient(135deg,#64748b 0%,#475569 100%);">查看更多参考信息</button> -->

          <!-- 保留但折叠的原始模块：事件分类、典型事件图库、特征信息、参考详情、当前点位频谱图 -->
          <section class="mp-drone-chart-card mp-event-collapsed-card" id="event-legacy-panel" hidden>
            <div class="mp-drone-chart-card__head">
              <div class="mp-drone-chart-card__title">更多参考信息</div>
            </div>
            <section class="mp-drone-chart-card mp-event-category-card">
              <div class="mp-drone-chart-card__head">
                <div class="mp-drone-chart-card__title">事件分类</div>
                <button type="button" class="mp-event-head-btn" id="event-add-category-btn">新增分类标签</button>
              </div>
              <div id="event-category-tabs" class="mp-event-category-tabs" role="tablist" aria-label="事件分类"></div>
            </section>

            <section class="mp-drone-chart-card mp-event-gallery-card">
              <div class="mp-drone-chart-card__head">
                <div class="mp-drone-chart-card__title">典型事件图库</div>
              </div>
              <div id="event-typical-gallery" class="mp-event-typical-gallery"></div>
            </section>

            <section class="mp-drone-chart-card mp-event-spectrum-card">
              <div class="mp-drone-chart-card__head mp-event-compare-head">
                <div class="mp-drone-chart-card__title">典型事件对比</div>
                <div id="event-reference-meta" class="mp-drone-chart-card__note mp-event-compare-note"></div>
              </div>
              <div class="mp-event-spectrum-wrap mp-event-spectrum-wrap--dark">
                <img id="event-reference-spectrum" class="mp-event-spectrum-img" alt="典型事件对比频谱图" />
              </div>
              <div id="event-reference-detail" class="mp-event-reference-detail"></div>
            </section>

            <section class="mp-drone-chart-card mp-event-feature-card">
              <div class="mp-drone-chart-card__head">
                <div class="mp-drone-chart-card__title">特征信息</div>
              </div>
              <div id="event-feature-list" class="mp-event-feature-list"></div>
            </section>

            <section class="mp-drone-chart-card mp-event-history-spectrum-card">
              <div class="mp-drone-chart-card__head mp-event-history-spectrum__head">
                <div class="mp-drone-chart-card__title" id="event-current-point-title">当前点位频谱图</div>
                <div id="event-current-tools" class="mp-event-current-tools" role="tablist" aria-label="历史模式">
                  <button type="button" class="mp-event-tool-btn is-active" data-mode="period">历史时段</button>
                  <button type="button" class="mp-event-tool-btn" data-mode="alarm">历史报警</button>
                </div>
              </div>

              <div id="event-generate-bar" class="mp-event-generate-bar">
                <label class="mp-event-form-field">
                  <span>年月日</span>
                  <input id="event-generate-date" type="date" class="mp-event-input" />
                </label>
                <label class="mp-event-form-field">
                  <span>时间</span>
                  <input id="event-generate-time" type="time" class="mp-event-input" value="23:59" />
                </label>
                <label class="mp-event-form-field">
                  <span>间隔</span>
                  <select id="event-generate-duration" class="mp-event-input">
                    <option value="30">30分钟</option>
                    <option value="60">60分钟</option>
                    <option value="120">120分钟</option>
                  </select>
                </label>
                <button type="button" id="event-generate-btn" class="mp-event-generate-btn">生成</button>
              </div>

              <div id="event-period-history-panel" class="mp-event-history-panel">
                <label class="mp-event-form-field">
                  <span>历史时段</span>
                  <select id="event-history-select" class="mp-event-input"></select>
                </label>
              </div>

              <div id="event-alarm-history-panel" class="mp-event-history-panel" hidden>
                <div id="event-history-list" class="mp-event-history-list is-gallery"></div>
              </div>

              <div class="mp-event-spectrum-wrap mp-event-spectrum-wrap--dark">
                <img id="event-baseline-spectrum" class="mp-event-spectrum-img" alt="当前点位频谱图" />
              </div>
            </section>
          </section>

        </div>
      </div>

      <footer class="mp-detail-footer mp-event-footer">
        <button type="button" class="mp-detail-footer__btn mp-detail-footer__btn--primary" id="event-submit-btn">提交标注</button>
      </footer>
    </section>
  </div>

  <div id="event-annotate-toast" class="project-toast mp-event-toast" aria-live="polite"></div>

  <!-- 频谱图预览弹窗 -->
  <div id="event-spectrum-preview-modal" class="mp-event-modal mp-event-modal--full" hidden>
    <div class="mp-event-modal__mask" data-action="close-spectrum-preview-modal"></div>
    <div class="mp-event-modal__panel" role="dialog" aria-modal="true" aria-label="频谱图预览">
      <div class="mp-event-modal__head">
        <div id="event-spectrum-preview-title" class="mp-event-modal__title">频谱图预览</div>
        <button type="button" class="mp-event-modal__close" data-action="close-spectrum-preview-modal" aria-label="关闭">×</button>
      </div>
      <div class="mp-event-modal__body mp-event-spectrum-preview-body">
        <button type="button" class="mp-event-spectrum-preview-arrow mp-event-spectrum-preview-arrow--prev" data-action="spectrum-preview-prev" aria-label="上一张"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="mp-event-spectrum-preview-stage">
          <img id="event-spectrum-preview-img" class="mp-event-spectrum-preview-img" src="" alt="" />
        </div>
        <button type="button" class="mp-event-spectrum-preview-arrow mp-event-spectrum-preview-arrow--next" data-action="spectrum-preview-next" aria-label="下一张"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div class="mp-event-spectrum-preview-counter">
        <span id="event-spectrum-preview-index">1</span> / <span id="event-spectrum-preview-total">2</span>
      </div>
    </div>
  </div>

  <!-- 新增分类标签弹窗 -->
  <div id="event-category-modal" class="mp-event-modal" hidden>
    <div class="mp-event-modal__mask" data-action="event-close-category-modal"></div>
    <div class="mp-event-modal__panel" role="dialog" aria-modal="true" aria-labelledby="event-category-modal-title">
      <div class="mp-event-modal__head">
        <div id="event-category-modal-title" class="mp-event-modal__title">新增分类标签</div>
        <button type="button" class="mp-event-modal__close" data-action="event-close-category-modal" aria-label="关闭">×</button>
      </div>
      <div class="mp-event-modal__body">
        <label class="mp-event-form-field">
          <span>分类标签名称</span>
          <input id="event-category-name" type="text" class="mp-event-input" maxlength="12" placeholder="请输入分类标签名称" />
        </label>
      </div>
      <div class="mp-event-modal__foot">
        <button type="button" class="mp-event-modal__btn mp-event-modal__btn--ghost" data-action="event-close-category-modal">取消</button>
        <button type="button" class="mp-event-modal__btn mp-event-modal__btn--primary" id="event-category-save-btn">保存</button>
      </div>
    </div>
  </div>

  <!-- 生成频谱图弹窗 -->
  <div id="event-generate-modal" class="mp-event-modal mp-event-modal--bottom" hidden>
    <div class="mp-event-modal__mask" data-action="event-close-generate-modal"></div>
    <div class="mp-event-modal__panel" role="dialog" aria-modal="true" aria-labelledby="event-generate-modal-title">
      <div class="mp-event-modal__head">
        <div id="event-generate-modal-title" class="mp-event-modal__title">生成频谱图</div>
        <button type="button" class="mp-event-modal__close" data-action="event-close-generate-modal" aria-label="关闭">×</button>
      </div>
      <div class="mp-event-generate-tabs" role="tablist" aria-label="生成频谱图方式">
        <button type="button" class="mp-event-generate-tab is-active" data-generate-tab="custom">自定义时段</button>
        <button type="button" class="mp-event-generate-tab" data-generate-tab="period">历史时段</button>
        <button type="button" class="mp-event-generate-tab" data-generate-tab="alarm">历史报警</button>
        <button type="button" class="mp-event-generate-tab" data-generate-tab="typical">典型事件</button>
      </div>
      <div class="mp-event-modal__body mp-event-generate-body">
        <!-- 自定义时段 -->
        <div id="event-generate-panel-custom" class="mp-event-generate-panel">
          <label class="mp-event-form-field mp-event-form-field--row">
            <span>年月日</span>
            <input id="event-modal-generate-date" type="date" class="mp-event-input" />
          </label>
          <label class="mp-event-form-field mp-event-form-field--row">
            <span>时间</span>
            <input id="event-modal-generate-time" type="time" class="mp-event-input" value="23:59" />
          </label>
          <label class="mp-event-form-field mp-event-form-field--row">
            <span>时间间隔</span>
            <select id="event-modal-generate-duration" class="mp-event-input">
              <option value="30">30分钟</option>
              <option value="60">60分钟</option>
              <option value="120">120分钟</option>
            </select>
          </label>
        </div>
        <!-- 历史时段 -->
        <div id="event-generate-panel-period" class="mp-event-generate-panel" hidden>
          <div id="event-generate-period-list" class="mp-event-generate-period-list"></div>
        </div>
        <!-- 历史报警 -->
        <div id="event-generate-panel-alarm" class="mp-event-generate-panel" hidden>
          <div id="event-generate-alarm-list" class="mp-event-generate-alarm-list"></div>
        </div>
        <!-- 典型事件 -->
        <div id="event-generate-panel-typical" class="mp-event-generate-panel" hidden>
          <div class="mp-event-generate-section">
            <div class="mp-event-generate-section__title">事件分类</div>
            <div id="event-generate-category-tabs" class="mp-event-generate-category-grid" role="tablist" aria-label="事件分类"></div>
          </div>
          <div class="mp-event-generate-section">
            <div class="mp-event-generate-section__title">典型事件图库</div>
            <div id="event-generate-typical-gallery" class="mp-event-generate-gallery-grid"></div>
          </div>
        </div>
      </div>
      <div class="mp-event-modal__foot mp-event-generate-foot">
        <button type="button" class="mp-event-generate-btn" id="event-modal-generate-btn">生成</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/miniapp-frame.js"></script>
  <script src="../../assets/js/event-annotate-mobile-page.js"></script>
</body>
</html>
