<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>设备领用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../assets/css/miniapp.css" />
  <link rel="stylesheet" href="../../assets/css/in-project-mobile.css" />
  <style>
    .bind-status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid transparent;
    }
    .bind-status--bound {
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(74, 222, 128, 0.1);
    }
    .bind-status--unbound {
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.35);
      background: rgba(148, 163, 184, 0.08);
    }
  </style>
</head>
<body class="mp-project-page miniapp-page" data-miniapp="page" data-module="patrol" data-title="设备领用" data-base="../">
  <header class="miniapp-navbar miniapp-navbar--inner">
    <button type="button" class="miniapp-navbar__back" data-action="mp-nav-back" aria-label="返回">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <h1 class="miniapp-navbar__title" id="bind-nav-title">设备领用</h1>
  </header>

  <div id="bind-app" class="mp-project-app">
    <section id="bind-list-view" class="mp-project-view">
      <div class="mp-list-scroll">
        <div class="mp-project-stats">
          <div class="mp-stat-card mp-stat-card--total">
            <div class="mp-stat-card__icon" aria-hidden="true"><i class="fa-solid fa-microchip"></i></div>
            <div class="mp-stat-card__body">
              <div class="mp-stat-card__value" id="stat-total"><span class="mp-stat-card__num">0</span><span class="mp-stat-card__unit">台</span></div>
              <div class="mp-stat-card__label">设备总数</div>
            </div>
          </div>
          <div class="mp-stat-card mp-stat-card--key">
            <div class="mp-stat-card__icon" aria-hidden="true"><i class="fa-solid fa-link"></i></div>
            <div class="mp-stat-card__body">
              <div class="mp-stat-card__value" id="stat-bound"><span class="mp-stat-card__num">0</span><span class="mp-stat-card__unit">台</span></div>
              <div class="mp-stat-card__label">已绑定</div>
            </div>
          </div>
          <div class="mp-stat-card mp-stat-card--general">
            <div class="mp-stat-card__icon" aria-hidden="true"><i class="fa-solid fa-link-slash"></i></div>
            <div class="mp-stat-card__body">
              <div class="mp-stat-card__value" id="stat-unbound"><span class="mp-stat-card__num">0</span><span class="mp-stat-card__unit">台</span></div>
              <div class="mp-stat-card__label">未绑定</div>
            </div>
          </div>
          <div class="mp-stat-card mp-stat-card--month">
            <div class="mp-stat-card__icon" aria-hidden="true"><i class="fa-solid fa-signal"></i></div>
            <div class="mp-stat-card__body">
              <div class="mp-stat-card__value" id="stat-online"><span class="mp-stat-card__num">0</span><span class="mp-stat-card__unit">台</span></div>
              <div class="mp-stat-card__label">在线设备</div>
            </div>
          </div>
        </div>

        <div class="mp-project-searchbar">
          <div class="mp-search-input-wrap">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="text" id="bind-search-trigger" class="mp-search-input" placeholder="搜索用户名称 / 设备IMEI / 型号" />
          </div>
          <button type="button" class="mp-filter-text-btn" data-action="open-bind-filter">筛选 <i class="fa-solid fa-filter" aria-hidden="true"></i></button>
        </div>

        <div id="bind-mobile-list" class="mp-project-list" role="list"></div>
      </div>
    </section>

    <section id="bind-detail-view" class="hidden mp-detail-view">
      <span id="bind-detail-name" hidden aria-hidden="true"></span>
      <div class="mp-detail-scroll">
        <div class="neon-panel neon-panel--tight mp-detail-panel">
          <div class="mp-detail-panel__body">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-semibold text-white">领用详情</h2>
              <span id="bind-detail-status" class="bind-status bind-status--unbound">未绑定</span>
            </div>
            <div class="mp-form-grid" id="bind-detail-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="bind-form-view" class="hidden mp-detail-view">
      <div class="mp-detail-scroll">
        <div class="neon-panel neon-panel--tight mp-detail-panel">
          <div class="mp-detail-panel__body">
            <h2 class="text-sm font-semibold text-white mb-3">绑定人员</h2>
            <div class="mp-form-grid">
              <div class="mp-form-row">
                <label class="project-form-label">设备IMEI</label>
                <input id="bind-imei" class="wh-input mp-field" readonly />
              </div>
              <div class="mp-form-row">
                <label class="project-form-label">设备型号</label>
                <input id="bind-model" class="wh-input mp-field" readonly />
              </div>
              <div class="mp-form-row">
                <label class="project-form-label project-required">所属线路</label>
                <select id="bind-line" class="wh-input mp-field"></select>
              </div>
              <div class="mp-form-row">
                <label class="project-form-label project-required">起始区间</label>
                <select id="bind-start" class="wh-input mp-field"></select>
              </div>
              <div class="mp-form-row">
                <label class="project-form-label project-required">终点区间</label>
                <select id="bind-end" class="wh-input mp-field"></select>
              </div>
              <div class="mp-form-row">
                <label class="project-form-label project-required">绑定人员</label>
                <select id="bind-person" class="wh-input mp-field"></select>
              </div>
              <div class="mp-form-row">
                <label class="project-form-label">手机号码</label>
                <input id="bind-phone" class="wh-input mp-field" readonly />
              </div>
              <div class="mp-form-row">
                <label class="project-form-label">所属部门</label>
                <input id="bind-dept" class="wh-input mp-field" readonly />
              </div>
              <div class="mp-form-row">
                <label class="project-form-label">领用开始时间</label>
                <input id="bind-use-start" type="datetime-local" class="wh-input mp-field" />
              </div>
              <div class="mp-form-row">
                <label class="project-form-label">领用结束时间</label>
                <input id="bind-use-end" type="datetime-local" class="wh-input mp-field" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer class="mp-detail-footer">
        <button type="button" class="mp-detail-footer__btn mp-detail-footer__btn--ghost" data-action="bind-cancel">取消</button>
        <button type="button" class="mp-detail-footer__btn mp-detail-footer__btn--primary" data-action="bind-save">确定绑定</button>
      </footer>
    </section>
  </div>

  <div id="bind-filter-sheet" class="mp-filter-sheet" aria-hidden="true">
    <div class="mp-filter-sheet__mask" data-action="close-bind-filter"></div>
    <div class="mp-filter-sheet__panel" role="dialog" aria-label="筛选条件">
      <div class="mp-filter-sheet__head">
        <h2>快捷筛选</h2>
        <button type="button" class="mp-icon-btn" data-action="close-bind-filter" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="mp-filter-sheet__body project-filter-panel">
        <label class="mp-filter-field mp-filter-field--full"><span>设备IMEI</span>
          <input id="filter-imei" class="wh-input w-full px-2" placeholder="请输入设备IMEI" />
        </label>
        <label class="mp-filter-field mp-filter-field--full"><span>设备型号</span>
          <input id="filter-model" class="wh-input w-full px-2" placeholder="请输入设备型号" />
        </label>
        <label class="mp-filter-field mp-filter-field--full"><span>用户名称</span>
          <input id="filter-user" class="wh-input w-full px-2" placeholder="请输入用户名称" />
        </label>
        <label class="mp-filter-field mp-filter-field--full"><span>所属线路</span>
          <select id="filter-line" class="wh-input w-full px-2">
            <option value="">全部</option>
            <option value="2号线">2号线</option>
            <option value="5号线">5号线</option>
            <option value="7号线">7号线</option>
            <option value="8号线">8号线</option>
            <option value="11号线">11号线</option>
          </select>
        </label>
        <label class="mp-filter-field mp-filter-field--full"><span>起始区间</span>
          <input id="filter-start" class="wh-input w-full px-2" placeholder="请输入起始区间" />
        </label>
        <label class="mp-filter-field mp-filter-field--full"><span>终点区间</span>
          <input id="filter-end" class="wh-input w-full px-2" placeholder="请输入终点区间" />
        </label>
      </div>
      <div class="mp-filter-sheet__foot">
        <button type="button" class="mp-btn mp-btn--ghost flex-1" data-action="reset-bind-filter">重置</button>
        <button type="button" class="mp-btn mp-btn--primary flex-1" data-action="search-bind">筛选</button>
      </div>
    </div>
  </div>

  <div id="mp-picker-sheet" class="mp-picker-sheet" aria-hidden="true">
    <div class="mp-picker-sheet__mask" data-action="mp-picker-mask-close"></div>
    <div class="mp-picker-sheet__panel" role="dialog">
      <div class="mp-picker-sheet__head">
        <button type="button" class="mp-picker-sheet__btn" data-action="mp-picker-cancel">取消</button>
        <h3 id="mp-picker-title" class="mp-picker-sheet__title">请选择</h3>
        <button type="button" class="mp-picker-sheet__btn mp-picker-sheet__btn--ok" data-action="mp-picker-confirm">确定</button>
      </div>
      <div id="mp-picker-body" class="mp-picker-sheet__body"></div>
    </div>
  </div>

  <div id="mp-confirm-mask" class="mp-confirm-mask" aria-hidden="true">
    <div class="mp-confirm-mask__panel" role="alertdialog" aria-labelledby="mp-confirm-title">
      <h3 id="mp-confirm-title" class="mp-confirm-mask__title">确认删除</h3>
      <p id="mp-confirm-msg" class="mp-confirm-mask__msg">确定要删除吗？此操作不可恢复。</p>
      <div class="mp-confirm-mask__actions">
        <button type="button" class="mp-confirm-mask__btn" data-action="mp-confirm-cancel">取消</button>
        <button type="button" class="mp-confirm-mask__btn mp-confirm-mask__btn--danger" data-action="mp-confirm-ok">确定删除</button>
      </div>
    </div>
  </div>

  <div class="project-toast" id="bind-toast" aria-live="polite"></div>

  <script src="../../assets/js/miniapp-config.js"></script>
  <script src="../../assets/js/miniapp-frame.js"></script>
  <script src="../../assets/js/gis-assets-base.js"></script>
  <script src="../../../assets/js/in-device-bind-data.js"></script>
  <script src="../../../assets/js/in-project-mobile.js"></script>
  <script src="../../../assets/js/in-device-bind-page.js"></script>
  <script src="../../assets/js/device-bind-page-boot.js"></script>
</body>
</html>
